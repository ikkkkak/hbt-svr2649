version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      FFMPEG_PATH: /usr/bin/ffmpeg
      SLIDESHOW_FONT_PATH: /usr/share/fonts/dejavu/DejaVuSans-Bold.ttf
      SLIDESHOW_BACKFILL_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped
