# syntax=docker/dockerfile:1
# Dokploy reads this path as the Dockerfile (misconfigured in dashboard).
# Canonical Dockerfile is ./Dockerfile — fix Dokploy: Dockerfile path = Dockerfile
FROM golang:1.25-alpine

RUN apk add --no-cache ffmpeg ttf-dejavu ca-certificates \
	chromium nss freetype harfbuzz ttf-freefont \
	&& ffmpeg -version \
	&& (command -v chromium || command -v chromium-browser || true) \
	&& ls -la /usr/bin/chromium* 2>/dev/null || true

ENV FFMPEG_PATH=/usr/bin/ffmpeg
ENV SLIDESHOW_FONT_PATH=/usr/share/fonts/dejavu/DejaVuSans-Bold.ttf
# Headless Chromium for scraping JavaScript-rendered sites (chromedp).
ENV CHROME_BIN=/usr/bin/chromium

WORKDIR /app

COPY go.mod go.sum ./
# Persist the module cache across builds (BuildKit cache mount).
RUN --mount=type=cache,target=/go/pkg/mod \
	go mod download

COPY . .

# Persist BOTH the module cache and the compiler build cache across builds, so
# only packages that actually changed are recompiled. This turns a ~16-min
# from-scratch build (heavy since Chromium/chromedp was added) into a short
# incremental one, avoiding Dokploy build timeouts/cancellations.
# -p=2 caps compiler parallelism to keep peak memory low on a small VM.
RUN --mount=type=cache,target=/go/pkg/mod \
	--mount=type=cache,target=/root/.cache/go-build \
	go build -p 2 -ldflags="-s -w" -o server .

EXPOSE 4000

CMD ["./server"]
